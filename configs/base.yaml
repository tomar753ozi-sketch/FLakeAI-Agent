# FlakeAI - Eğitim Konfigürasyonu

model:
  variant: "base"  # tiny, small, base, medium
  vocab_size: 50000

training:
  batch_size: 4
  learning_rate: 3e-4
  weight_decay: 0.1
  max_epochs: 100
  warmup_steps: 1000
  max_grad_norm: 1.0
  gradient_accumulation_steps: 4
  save_every: 1000
  eval_every: 500
  output_dir: "checkpoints"

data:
  max_length: 2048
  num_workers: 0

hardware:
  device: "cpu"
  mixed_precision: false
  compile: false
